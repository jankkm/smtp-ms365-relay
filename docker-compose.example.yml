services:
  app:
    image: ghcr.io/jankkm/smtp-ms365-relay:latest
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "2587:2587"
      - "5000:5000"
    volumes:
      - smtp_relay_data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  smtp_relay_data:
