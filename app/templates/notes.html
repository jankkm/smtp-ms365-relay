{% extends "base.html" %}
{% block title %}Notes – SMTP Relay{% endblock %}

{% block content %}
<h4 class="fw-semibold mb-4"><i class="bi bi-journal-text me-2"></i>Notes</h4>

<div class="card border-0 shadow-sm">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <span class="fw-semibold">Admin notes</span>
    <button type="button" id="editNotesBtn" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-pencil me-1"></i>Edit
    </button>
  </div>
  <div class="card-body">
    <div id="notesView">
      {% if notes_html %}
        <div class="notes-markdown">{{ notes_html }}</div>
      {% else %}
        <p class="text-muted mb-0">No notes yet.</p>
      {% endif %}
    </div>
    <form id="notesEdit" method="post" action="{{ url_for('notes.save') }}" class="d-none">
      <textarea name="notes" id="notesTextarea" class="form-control font-monospace" rows="18"
                placeholder="Markdown supported">{{ notes }}</textarea>
      <div class="form-text mb-3">Markdown supported: headings, lists, links, **bold**, *italic*, code blocks, tables.</div>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-save me-1"></i>Save
      </button>
      <button type="button" id="cancelNotesBtn" class="btn btn-secondary">Cancel</button>
    </form>
  </div>
</div>

<style>
  .notes-markdown { line-height: 1.6; }
  .notes-markdown h1, .notes-markdown h2, .notes-markdown h3,
  .notes-markdown h4, .notes-markdown h5, .notes-markdown h6 {
    margin-top: 1rem;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }
  .notes-markdown h1 { font-size: 1.5rem; }
  .notes-markdown h2 { font-size: 1.25rem; }
  .notes-markdown h3 { font-size: 1.1rem; }
  .notes-markdown p { margin-bottom: 0.75rem; }
  .notes-markdown ul, .notes-markdown ol { margin-bottom: 0.75rem; padding-left: 1.5rem; }
  .notes-markdown pre {
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    padding: 0.75rem 1rem;
    overflow-x: auto;
    margin-bottom: 0.75rem;
  }
  .notes-markdown code {
    font-family: monospace;
    font-size: 0.875em;
    background: #f8f9fa;
    padding: 0.1rem 0.3rem;
    border-radius: 0.25rem;
  }
  .notes-markdown pre code { background: none; padding: 0; }
  .notes-markdown table {
    width: 100%;
    margin-bottom: 0.75rem;
    border-collapse: collapse;
  }
  .notes-markdown th, .notes-markdown td {
    border: 1px solid #dee2e6;
    padding: 0.375rem 0.75rem;
  }
  .notes-markdown th { background: #f8f9fa; }
  .notes-markdown blockquote {
    border-left: 3px solid #dee2e6;
    padding-left: 1rem;
    color: #6c757d;
    margin-bottom: 0.75rem;
  }
  .notes-markdown a { word-break: break-word; }
</style>

<script>
(function () {
  const view = document.getElementById('notesView');
  const edit = document.getElementById('notesEdit');
  const editBtn = document.getElementById('editNotesBtn');
  const cancelBtn = document.getElementById('cancelNotesBtn');
  const textarea = document.getElementById('notesTextarea');

  function showView() {
    view.classList.remove('d-none');
    edit.classList.add('d-none');
    editBtn.classList.remove('d-none');
  }

  function showEdit() {
    view.classList.add('d-none');
    edit.classList.remove('d-none');
    editBtn.classList.add('d-none');
    textarea.focus();
  }

  editBtn.addEventListener('click', showEdit);
  cancelBtn.addEventListener('click', showView);
})();
</script>
{% endblock %}
