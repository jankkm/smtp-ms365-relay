<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – SMTP Relay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; }
    .login-card { max-width: 420px; }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100">
<div class="container d-flex justify-content-center">
  <div class="login-card w-100">
    <div class="text-center mb-4">
      <i class="bi bi-envelope-arrow-up-fill text-primary" style="font-size: 3rem;"></i>
      <h3 class="mt-2 fw-semibold">SMTP Relay</h3>
      <p class="text-muted">Sign in to manage your relay</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 23 23">
            <path fill="#f3f3f3" d="M0 0h23v23H0z"/>
            <path fill="#f35325" d="M1 1h10v10H1z"/>
            <path fill="#81bc06" d="M12 1h10v10H12z"/>
            <path fill="#05a6f0" d="M1 12h10v10H1z"/>
            <path fill="#ffba08" d="M12 12h10v10H12z"/>
          </svg>
          Sign in with Microsoft
        </a>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">
      The first user to sign in will be granted admin rights.
    </p>
  </div>
</div>
</body>
</html>
