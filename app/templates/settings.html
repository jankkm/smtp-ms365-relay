{% extends "base.html" %}
{% block title %}Settings – SMTP Relay{% endblock %}

{% block content %}
<h4 class="fw-semibold mb-4"><i class="bi bi-gear me-2"></i>Settings</h4>

<div class="card border-0 shadow-sm" style="max-width: 540px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-4">
        <label class="form-label fw-semibold">Email retention (days)</label>
        <input type="number" name="retention_days" class="form-control"
               value="{{ settings.retention_days }}" min="1" required>
        <div class="form-text">
          Emails older than this many days are deleted automatically.
          The job runs once at startup and then every 24 hours.
        </div>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-save me-1"></i>Save settings
      </button>
    </form>
  </div>
</div>
{% endblock %}
